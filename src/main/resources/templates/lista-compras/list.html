<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Lista de Compras</title>
</head>
<body>
    <div layout:fragment="content">
        <h1 class="mb-4">Lista de Compras</h1>

        <div class="mb-3 d-flex justify-content-between">
            <a class="btn btn-primary" href="/lista-compras/novo">Novo item</a>
            <div>
                <strong>Total itens:</strong> <span th:text="${totalItens}">0</span>
                <span class="ms-3"><strong>Total geral:</strong> <span th:text="|R$ ${#numbers.formatDecimal(totalGeral, 1, 2, 'POINT')}|">R$ 0.00</span></span>
            </div>
        </div>

        <table class="table table-bordered table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Descrição</th>
                    <th>Preço Unitário</th>
                    <th>Quantidade</th>
                    <th>Total</th>
                    <th>Data/Hora</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${itens}">
                    <td th:text="${item.id}"></td>
                    <td th:text="${item.descricao}"></td>
                    <td th:text="|R$ ${#numbers.formatDecimal(item.precoUnitario, 1, 2, 'POINT')}|"></td>
                    <td th:text="${#numbers.formatDecimal(item.quantidade, 1, 2, 'POINT')}"></td>
                    <td th:text="|R$ ${#numbers.formatDecimal(item.total, 1, 2, 'POINT')}|"></td>
                    <td th:text="${#temporals.format(item.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
                    <td>
                        <a class="btn btn-sm btn-warning" th:href="@{/lista-compras/{id}/editar(id=${item.id})}">Editar</a>
                        <a class="btn btn-sm btn-danger" th:href="@{/lista-compras/{id}/deletar(id=${item.id})}" onclick="return confirm('Excluir item?')">Excluir</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(itens)}">
                    <td colspan="7" class="text-center">Nenhum item cadastrado.</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
