<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title th:text="${isEdicao} ? 'Editar item' : 'Novo item'">Formulário</title>
</head>
<body>
    <div layout:fragment="content">
        <h1 class="mb-4" th:text="${isEdicao} ? 'Editar item' : 'Novo item'"></h1>

        <form th:object="${item}" th:action="${isEdicao} ? @{/lista-compras/atualizar} : @{/lista-compras}" method="post" class="row g-3">
            <input type="hidden" th:field="*{id}" th:if="${isEdicao}">

            <div class="col-12">
                <label class="form-label" for="descricao">Descrição</label>
                <input type="text" class="form-control" id="descricao" th:field="*{descricao}" required maxlength="255">
            </div>

            <div class="col-md-6">
                <label class="form-label" for="precoUnitario">Preço unitário</label>
                <input type="number" class="form-control" id="precoUnitario" th:field="*{precoUnitario}" step="0.01" min="0.01" required>
            </div>

            <div class="col-md-6">
                <label class="form-label" for="quantidade">Quantidade</label>
                <input type="number" class="form-control" id="quantidade" th:field="*{quantidade}" step="0.01" min="0.01" required>
            </div>

            <div class="col-12 d-flex gap-2">
                <a class="btn btn-secondary" href="/lista-compras">Cancelar</a>
                <button class="btn btn-primary" type="submit" th:text="${isEdicao} ? 'Atualizar' : 'Inserir'"></button>
            </div>
        </form>
    </div>
</body>
</html>
