<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title != null ? title + ' - DevOps Homestead' : 'DevOps Homestead'}">DevOps Homestead</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/base-style.css}">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-house"></i> DevOps Homestead
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/lista-afazeres">
                            <i class="bi bi-check2-square"></i> Lista de Afazeres
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/lista-compras">
                            <i class="bi bi-bag-check"></i> Lista de Compras
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container-main">
        <div class="container">
            <!-- Alertas -->
            <div th:if="${mensagem}" th:class="|alert alert-${tipo != null ? tipo : 'info'} alert-dismissible fade show|" role="alert">
                <i th:class="|bi bi-${tipo == 'sucesso' ? 'check-circle' : 'exclamation-circle'}|"></i>
                <span th:text="${mensagem}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Conteúdo -->
            <div layout:fragment="content"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 DevOps Homestead - Projeto de Organização Domiciliar</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
