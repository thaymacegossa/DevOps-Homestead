version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: homestead-db
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - TZ=${TZ}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - homestead-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    container_name: homestead-app
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - TZ=${TZ}
      - SPRING_PROFILES_ACTIVE=${APP_PROFILE:-dev}
    ports:
      - "${APP_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - homestead-net
    restart: on-failure:5

volumes:
  postgres-data:
    driver: local

networks:
  homestead-net:
    driver: bridge
